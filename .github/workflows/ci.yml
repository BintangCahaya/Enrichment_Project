name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Check out your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run tests with Jest
      - name: Run tests
        run: npm test

      # 5️⃣ (Optional) Upload test coverage to GitHub summary
      - name: Upload coverage report
        if: success()
        run: |
          echo "✅ All tests passed successfully!"
