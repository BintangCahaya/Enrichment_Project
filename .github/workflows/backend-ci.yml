name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js (match your local version)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'   # adjust if your local Node version is different

      # 3️⃣ Install backend dependencies
      - name: Install dependencies
        run: npm install
        working-directory: backend

      # 4️⃣ Run backend tests with Jest
      - name: Run tests
        run: npm test
        working-directory: backend

      # 5️⃣ Generate coverage report
      - name: Generate coverage report
        run: npx jest --coverage
        working-directory: backend
